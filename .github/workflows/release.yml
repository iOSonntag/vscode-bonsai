name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request or GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  package:
    name: Build and package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSIX: vscode-bonsai-${{ needs.release-please.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      - name: Integration tests
        # VS Code needs a display server on Linux.
        run: xvfb-run --auto-servernum pnpm run test:integration

      - name: Package the extension
        run: pnpm exec vsce package --no-dependencies --out "$VSIX"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ env.VSIX }}
          retention-days: 30

  attach:
    name: Attest and attach the package to the release
    needs: [release-please, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VSIX: vscode-bonsai-${{ needs.release-please.outputs.version }}.vsix
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.VSIX }}

      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$VSIX" --clobber

  # The publish job holds an OIDC-capable token. It installs no dependency tree.
  # It runs only the publisher CLI, at the exact version pinned in package.json.
  publish-marketplace:
    name: Publish to the Visual Studio Marketplace
    needs: [release-please, package]
    runs-on: ubuntu-latest
    environment:
      name: visual-studio-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=iOSonntag.vscode-bonsai
    permissions:
      contents: read
      id-token: write
    env:
      VSIX: vscode-bonsai-${{ needs.release-please.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish
        # Trusted publishing replaces the token: drop VSCE_PAT and add --oidc.
        # That needs @vscode/vsce 3.9.3 or newer and a trusted publishing policy on the Marketplace.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSCE_VERSION="$(node -p "require('./package.json').devDependencies['@vscode/vsce']")"
          pnpm --package="@vscode/vsce@$VSCE_VERSION" dlx vsce publish --packagePath "$VSIX"
